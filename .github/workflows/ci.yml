name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # Resolve the newest 1.26.x rather than whichever patch the runner has
          # cached. govulncheck reports standard-library advisories, so a stale
          # toolchain fails the build for vulnerabilities that are already fixed
          # upstream and that no change to this repository can address.
          check-latest: true
      - name: vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...
      - name: curation quality gate
        run: go run ./cmd/tapeit curate --evaluate
